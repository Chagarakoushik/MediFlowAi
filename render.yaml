services:
  - type: web
    name: careflow-ai-backend
    runtime: python
    buildCommand: "pip install -r backend/requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend"
    healthCheckPath: /health
    plan: free
    autoDeploy: true
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./careflow.db
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-1.5-flash
      - key: N8N_DEFAULT_WEBHOOK_URL
        value: https://n8n.careflow-demo.internal/webhook/healthcare-followup
      - key: SIMULATION_MODE_DEFAULT
        value: "True"
